    /* Apply the saved theme before first paint. Light is the default. */
    try {
      if (localStorage.getItem('cp_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>

  <style>
    /* 404 — the India outline motif, drawn as a watermark behind the card.
       Inline so a nested GitHub Pages 404 URL still arrives styled. */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-page);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      line-height: 1.62;
      overflow-x: clip;
    }

    .not-found {
      position: relative;
      isolation: isolate;
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2.5rem, 6vw, 4.5rem) 1.25rem;
    }

    /* India outline, faint, bleeding off the right edge */
    .nf-map {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: max(-8vw, -140px);
      width: min(70vw, 620px);
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.5;
    }

    .nf-map svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .nf-map path {
      fill: var(--stage-bg);
      fill-opacity: 0.5;
      stroke: var(--stage-border);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .not-found-card {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: clamp(1.75rem, 4vw, 2.75rem);
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .not-found-code {
      display: inline-block;
      margin-bottom: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-ink);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .not-found-card h1 {
      margin: 0 0 0.75rem;
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .not-found-card p {
      margin: 0 auto 1.75rem;
      max-width: 42ch;
      color: var(--ink-secondary);
      font-size: 1.02rem;
    }

    .not-found-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .nf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.6rem 1.1rem;
      border-radius: 11px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out),
        transform 150ms var(--ease-out);
    }

    .nf-btn:active { transform: scale(0.99); }

    .nf-btn--primary {
      background: var(--accent-cta);
      color: var(--ink-on-accent);
      border: 1px solid var(--accent-cta-hover);
    }

    .nf-btn--primary:hover { background: var(--accent-cta-hover); color: var(--ink-on-accent); }

    .nf-btn--secondary {
      background: var(--bg-card);
      color: var(--ink-primary);
      border: 1px solid var(--border-warm);
    }

    .nf-btn--secondary:hover { background: var(--surface-hover); }

    .nf-footer {
      padding: 1.25rem;
      text-align: center;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    @media (max-width: 767px) {
      .nf-map {
        top: auto;
        bottom: -60px;
        right: -30vw;
        width: 120vw;
        transform: none;
        opacity: 0.35;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nf-btn { transition: none; }
    }
  </style>
</head>

  <script>
    /* Keep links working on GitHub Pages repo subpaths even from deep 404 URLs */
    (function () {
      if (window.location.hostname.indexOf('github.io') === -1) return;
      var parts = window.location.pathname.split('/').filter(Boolean);
      var base = parts.length ? '/' + parts[0] + '/' : '/';
      document.querySelectorAll('[data-root-link]').forEach(function (a) {
        a.setAttribute('href', base + a.getAttribute('data-root-link'));
      });
    })();
  </script>
